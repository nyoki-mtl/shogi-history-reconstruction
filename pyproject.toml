[project]
name = "shogi-history-reconstruction"
version = "1.0.0"
description = "Legal-projected reconstruction of plausible shogi game histories"
readme = "README.md"
authors = [
    { name = "Hiroki Taniai" },
    { name = "Hidetsugu Irie" },
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "omegaconf>=2.3.0",
    "tqdm>=4.67.1",
    "torch==2.11.0",
    "tensorboard>=2.14.0",
    "wandb>=0.21.0",
    "pytorch-lightning>=2.6.4",
    "webdataset>=0.2.48",
    "onnxruntime>=1.22.1",
    "rsshogi==1.2.3",
]

[project.urls]
Repository = "https://github.com/nyoki-mtl/shogi-history-reconstruction"
Artifacts = "https://github.com/nyoki-mtl/shogi-history-reconstruction/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
    "ty>=0.0.39",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posdiffusion"]

[tool.ruff]
line-length = 120
exclude = [".venv", "_refs", "external"]
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
markers = [
    "integration: marks tests that exercise multiple components together",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120
